listen:
  host: 0.0.0.0
  port: 8080
  public_url: https://claude-gateway.claudegw-lab-test.click
  trusted_proxies:
    - 10.0.0.0/24
    - 10.0.1.0/24

oidc:
  issuer: https://login.microsoftonline.com/<ENTRA_TENANT_ID>/v2.0
  client_id: REPLACE_WITH_ENTRA_APPLICATION_CLIENT_ID
  client_secret: ${OIDC_CLIENT_SECRET}
  allowed_groups:
    - REPLACE_WITH_TIER_10_ENTRA_GROUP_OBJECT_ID
    - REPLACE_WITH_TIER_20_ENTRA_GROUP_OBJECT_ID
  scopes: [openid, profile, email, offline_access]

session:
  jwt_secret: ${GATEWAY_JWT_SECRET}
  ttl_hours: 8

store:
  postgres_url: ${GATEWAY_POSTGRES_URL}
  username: gateway_admin
  password: ${GATEWAY_POSTGRES_PASSWORD}

managed:
  policies:
    - match:
        groups: [REPLACE_WITH_TIER_10_ENTRA_GROUP_OBJECT_ID]
      cli:
        availableModels: [claude-sonnet-4-6]
        enforceAvailableModels: true
        permissions: {}
    - match:
        groups: [REPLACE_WITH_TIER_20_ENTRA_GROUP_OBJECT_ID]
      cli:
        availableModels: [claude-sonnet-4-6, claude-haiku-4-5]
        enforceAvailableModels: true
        permissions: {}

upstreams:
  - provider: bedrock
    region: us-east-1
    auth: {}

auto_include_builtin_models: true